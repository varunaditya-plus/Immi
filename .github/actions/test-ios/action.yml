name: Test iOS app
description: Build and run SelfPhotos tests on an available iPhone simulator.

runs:
  using: composite
  steps:
    - name: Select iPhone simulator
      shell: bash
      run: |
        set -euo pipefail
        xcodebuild -version
        xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
        device_id=$(jq -r '[.devices | to_entries[] | select(.key | contains("SimRuntime.iOS-27-")) | .value[] | select(.isAvailable == true and (.name | startswith("iPhone")))] | .[0].udid // empty' "$RUNNER_TEMP/devices.json")
        if [[ -z "$device_id" ]]; then
          echo "::error::No available iPhone simulator with an iOS 27 runtime."
          xcrun simctl list devices available
          exit 1
        fi
        echo "SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"

    - name: Build and test
      shell: bash
      run: |
        set -euo pipefail
        verify_results() {
          local bundle="$1"
          local summary="${bundle}.summary.json"
          if ! xcrun xcresulttool get test-results summary --path "$bundle" > "$summary"; then
            echo "::error::Could not read test results from $bundle."
            return 1
          fi
          if ! jq -e '.result == "Passed" and (.passedTests | type == "number") and .passedTests > 0 and .failedTests == 0' "$summary" > /dev/null; then
            echo "::error::Test results must report a passed run with executed tests and no failures: $bundle."
            cat "$summary"
            return 1
          fi
        }
        test_arguments=(
          -project ImmichApp.xcodeproj
          -scheme SelfPhotos
          -configuration Debug
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -parallel-testing-enabled NO
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=YES
          CODE_SIGN_IDENTITY=-
        )
        xcodebuild test "${test_arguments[@]}" \
          -testLanguage en -testRegion US \
          -resultBundlePath "$RUNNER_TEMP/SelfPhotosTests.xcresult"
        verify_results "$RUNNER_TEMP/SelfPhotosTests.xcresult"
        for suite in SyncStatusLocalizationTests AppFallbackLocalizationTests; do
          result_bundle="$RUNNER_TEMP/SelfPhotosFrench-${suite}.xcresult"
          xcodebuild test "${test_arguments[@]}" \
            -testLanguage fr -testRegion FR \
            -only-testing:"ImmichAppTests/$suite" \
            -resultBundlePath "$result_bundle"
          verify_results "$result_bundle"
        done

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: SelfPhotos-test-results
        path: |
          ${{ runner.temp }}/SelfPhotosTests.xcresult
          ${{ runner.temp }}/SelfPhotosFrench-*.xcresult
        if-no-files-found: ignore
        retention-days: 7
