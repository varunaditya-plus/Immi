name: SelfPhotos PR Build

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Build and test SelfPhotos
        uses: ./.github/actions/test-ios
